<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/routine-planner/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Routine" />
    <link rel="apple-touch-icon" href="/routine-planner/icons/icon.svg" />
    <title>Routine Planner</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('routine-theme')
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0d0f0e')
          }
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/routine-planner/assets/index-YfqiX06x.js"></script>
    <link rel="stylesheet" crossorigin href="/routine-planner/assets/index-CvJp0zhh.css">
  <link rel="manifest" href="/routine-planner/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/routine-planner/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
